<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Catarina">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- "C" multicolorido (abertura à direita) -->
  <g fill="none" stroke-width="64" stroke-linecap="round" filter="url(#glow)">
    <path d="M352.4 370.9 A150 150 0 0 1 247.4 405.7" stroke="#FF3B30"/>
    <path d="M247.4 405.7 A150 150 0 0 1 146.8 358.8" stroke="#FF9500"/>
    <path d="M146.8 358.8 A150 150 0 0 1 106 256"   stroke="#FFD60A"/>
    <path d="M106 256   A150 150 0 0 1 146.8 153.2" stroke="#34C759"/>
    <path d="M146.8 153.2 A150 150 0 0 1 247.4 106.3" stroke="#32ADE6"/>
    <path d="M247.4 106.3 A150 150 0 0 1 352.4 141.1" stroke="#AF52DE"/>
  </g>
</svg>
